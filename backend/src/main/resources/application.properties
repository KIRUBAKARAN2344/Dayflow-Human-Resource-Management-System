# ==============================================================================
# Dayflow Human Resource Management System - Spring Boot Configuration
# ==============================================================================

spring.application.name=dayflow-backend

# Server Configuration
server.port=8080

# MySQL Database Configuration Placeholder
spring.datasource.url=jdbc:mysql://localhost:3306/dayflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration Placeholder
jwt.secret=dayflow_super_secret_jwt_key_2026_change_in_production_environment_needs_256_bits
jwt.expiration=86400000
