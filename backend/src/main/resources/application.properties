# ==============================================================================
# Dayflow Human Resource Management System - Spring Boot Configuration
# ==============================================================================

spring.application.name=dayflow-backend

# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dayflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Supports Environment Variable with Local Dev Fallback)
jwt.secret=${JWT_SECRET:dayflow_super_secret_jwt_key_2026_change_in_production_environment_needs_256_bits}
jwt.expiration=86400000
