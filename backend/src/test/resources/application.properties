# Test configuration - uses H2 in-memory database instead of MySQL
spring.application.name=dayflow

# H2 in-memory datasource (overrides MySQL in main application.properties)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (optional, handy during local test debugging)
spring.h2.console.enabled=true

# Dummy JWT secret for tests (must be at least 256 bits for HS256)
jwt.secret=test-secret-key-for-junit-tests-only-do-not-use-in-production-12345
